[project]
name = "quickedit"
version = "0.1.0"
description = "AI-powered video editor that trims silence, filler, and tangents. Adds subtitles."
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "anthropic>=0.40.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
quickedit = "src.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
