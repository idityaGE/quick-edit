name: Bug report
description: Report a reproducible problem in QuickEdit.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, private transcripts, or source videos."
  - type: input
    id: version
    attributes:
      label: QuickEdit version
      placeholder: "quickedit --version"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python, and FFmpeg versions
    validations:
      required: true
